name: Weekly coverage audit

# Every Monday: which venues may be missing shows. Writes audit.md (a backup scheduled task also starts it).
on:
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit
        run: python scraper/audit.py >> "$GITHUB_STEP_SUMMARY"
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.md audit.json
          git diff --cached --quiet || { git commit -m "Coverage audit $(date +%F) [skip ci]"; git pull --rebase -q; git push; }
