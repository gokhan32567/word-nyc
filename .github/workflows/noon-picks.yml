name: Noon picks notification

# Sends "Tonight's picks" to everyone who turned on notifications, once a day at noon New York time.
# 16:00 UTC is noon in daylight time, 17:00 UTC in standard time; a backup scheduled task also starts
# this workflow, and push-log.json makes sure only the first run each day sends.
on:
  schedule:
    - cron: "57 15 * * *"
    - cron: "57 16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send again even if today's already went out"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: noon-picks
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Is it around noon in New York?
        id: when
        run: |
          h=$(TZ=America/New_York date +%-H)
          echo "New York hour: $h"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$h" -ge 11 ] && [ "$h" -le 13 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.when.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Send
        if: steps.when.outputs.go == 'true'
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python scraper/notify.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Record it
        if: steps.when.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- push-log.json)" ]; then
            cp push-log.json /tmp/push-log.json
            git fetch --quiet origin main && git reset --quiet --hard origin/main
            cp /tmp/push-log.json push-log.json
            git add push-log.json
            git commit -m "Noon picks sent $(TZ=America/New_York date +%F) [skip ci]"
            git push origin HEAD:main
          fi
