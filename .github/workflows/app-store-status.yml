name: App Store status

# Read-only: shows where the app is in App Review - app/ci/status.py
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyjwt cryptography requests
      - run: python3 app/ci/status.py
