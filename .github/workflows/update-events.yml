name: Update tonight's lineup

# Runs at 5:00 AM New York time every day, all year.
# GitHub cron is UTC and busy at the top of the hour (scheduled runs there can be dropped), so the job
# is scheduled a few minutes past, several times: 09:07 UTC is 5:07 AM in daylight time, 10:07 UTC is
# 5:07 AM in standard time, and the later ones are retries. The check step below makes every run after
# the first successful one a no-op.
on:
  schedule:
    - cron: "7 9 * * *"
    - cron: "37 9 * * *"
    - cron: "7 10 * * *"
    - cron: "37 10 * * *"
    - cron: "17 11 * * *"
    - cron: "17 12 * * *"
    - cron: "17 14 * * *"
  workflow_dispatch:      # "Run workflow" button for a manual refresh
    inputs:
      venues:
        description: "Only read venues whose name contains this text (blank = all)"
        required: false
        default: ""
  push:                   # editing sponsored placements or the scraper republishes tonight's lineup
    branches: [main]
    paths: ["sponsored.json", "scraper/**", ".github/workflows/update-events.yml"]

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Is a refresh due?
        id: due
        run: |
          night=$(TZ=America/New_York date -d '-5 hours' +%F)
          current=$(python3 -c "import json;print(json.load(open('events.json')).get('date',''))" 2>/dev/null || echo "")
          echo "night=$night current=$current"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$current" != "$night" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Lineup for $night is already published; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.due.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Cache the browser
        if: steps.due.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.0-${{ runner.os }}

      - name: Install the browser
        if: steps.due.outputs.run == 'true'
        run: |
          pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Build events.json
        if: steps.due.outputs.run == 'true'
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          LISTINGS_EMAIL: ${{ secrets.LISTINGS_EMAIL }}
          LISTINGS_APP_PASSWORD: ${{ secrets.LISTINGS_APP_PASSWORD }}
          SUBMISSIONS_CSV_URL: ${{ vars.SUBMISSIONS_CSV_URL || 'https://docs.google.com/spreadsheets/d/174lJiYMrAUm_LBETSMj9RTCXXQl1S5xS19QNXXlxonc/gviz/tq?tqx=out:csv&sheet=Approved' }}
          VENUE_FILTER: ${{ github.event.inputs.venues }}
        run: python scraper/scrape.py

      - name: Save test-run details to the debug branch
        if: steps.due.outputs.run == 'true' && github.event.inputs.venues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet -B debug
          git add -f debug.txt events.json coverage.json
          git commit --quiet -m "Test run: ${{ github.event.inputs.venues }}"
          git push --quiet -f origin debug

      - name: Commit and publish
        # A run limited to a few venues is a test: it shows results in the log but doesn't publish.
        if: steps.due.outputs.run == 'true' && !github.event.inputs.venues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Publish on top of the latest main (another run or a push may have landed meanwhile);
          # this run's freshly built files win.
          out=$(mktemp -d)
          cp events.json coverage.json "$out"/
          [ -f scraper/geocache.json ] && cp scraper/geocache.json "$out"/
          git fetch --quiet origin main
          git reset --quiet --hard origin/main
          cp "$out"/events.json "$out"/coverage.json .
          [ -f "$out"/geocache.json ] && cp "$out"/geocache.json scraper/
          python scraper/pages.py
          git add events.json coverage.json sitemap.xml tonight venues
          [ -f scraper/geocache.json ] && git add scraper/geocache.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Lineup for $(TZ=America/New_York date -d '-5 hours' +%F)"
            git push origin HEAD:main
          fi
