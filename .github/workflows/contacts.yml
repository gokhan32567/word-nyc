name: Venue contacts

# Manual only: collects the public contact emails shown on venue websites, for venue outreach.
on:
  workflow_dispatch:
    inputs:
      venues:
        description: "Comma-separated venue names (or parts of names)"
        required: true

permissions:
  contents: write

jobs:
  contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.0-${{ runner.os }}
      - run: |
          pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Find contact emails
        run: python scraper/contacts.py "${{ github.event.inputs.venues }}"
      - name: Save to the contacts branch
        run: |
          cp contacts.json /tmp/contacts.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet --orphan contacts
          git rm -rq --cached . && git clean -fdq -e contacts.json
          cp /tmp/contacts.json contacts.json
          git add contacts.json
          git commit -qm "Venue contacts [skip ci]"
          git push -f origin contacts
